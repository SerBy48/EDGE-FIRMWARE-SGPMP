# Dependabot: PRs de actualizacion de dependencias.
# Recomendacion 3 de INFORME-CALIBRACION-SAST-SCA-CI-M03-M04 (Taiga #5045, hallazgo I-5).
# Complementa el job de pip-audit del ci.yml: pip-audit bloquea vulnerabilidades conocidas,
# Dependabot propone las actualizaciones. Los PRs llegan a develop (Git Flow).
# Nota: Dependabot solo lee este archivo desde la rama por defecto (main),
# asi que empieza a funcionar cuando el cambio se libere a main.
# esp32/ (PlatformIO) no lo soporta Dependabot.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/raspberry"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      menores-y-parches:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"

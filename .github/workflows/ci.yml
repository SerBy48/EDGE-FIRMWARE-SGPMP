name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Mínimo privilegio (SEG-CICD-01, #31): el GITHUB_TOKEN solo lee. El único job
# que escribe (release) declara sus permisos y además empuja con GH_TOKEN.
permissions:
  contents: read

jobs:
  raspberry:
    name: edge_agent (Raspberry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raspberry
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # Raspberry Pi OS bookworm trae Python 3.11.
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Sintaxis de scripts
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck --severity=warning scripts/*.sh tests/updater/*.sh
      - name: Actualización automática (elección de release y rollback)
        # Root: update.sh solo instala como root. install.sh y systemctl son falsos.
        run: sudo -E bash tests/updater/test_update.sh

  esp32:
    name: Firmware nodo sensor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('esp32/platformio.ini') }}
      - run: pip install platformio
      - name: Tests del protocolo (vectores compartidos con Python)
        run: pio test -e native
      # El ESP32 va primero: si espressif8266 se instala antes, espressif32
      # queda sin el módulo intelhex de su esptool y falla al generar el .bin.
      - name: Compilación ESP32
        run: pio run -e esp32dev
      - name: Compilación ESP8266
        run: pio run -e nodemcuv2

  # SAST del código Python de la Raspberry (SEG-CICD-01, #31). Los scripts de
  # shell ya pasan por shellcheck en el job raspberry. Bloquea solo con
  # severidad HIGH; el reporte completo queda en el log para revisarlo.
  sast:
    name: Seguridad (SAST, Bandit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raspberry
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install "bandit>=1.8,<2"
      - name: Reporte completo (no bloquea)
        run: bandit -r edge_agent edge_vision --exit-zero
      - name: Hallazgos HIGH (bloquea)
        run: bandit -r edge_agent edge_vision -q --severity-level high --confidence-level medium

  # SCA de las dependencias del edge_agent, con los extras que se instalan en
  # campo (lora, vision). Se audita lo que resuelve pip, no el rango de
  # pyproject.toml: lo que llegaría a una Pi instalada hoy.
  sca:
    name: Seguridad (SCA, pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raspberry
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Resolver dependencias
        run: |
          python -m venv /tmp/edge-deps
          /tmp/edge-deps/bin/pip install -q ".[lora,vision]"
          /tmp/edge-deps/bin/pip freeze --exclude-editable | grep -vi '^sgpmp-edge-agent' > /tmp/requirements.txt
          cat /tmp/requirements.txt
      - run: pip install "pip-audit>=2.7,<3"
      - name: Vulnerabilidades conocidas (bloquea)
        run: pip-audit -r /tmp/requirements.txt --no-deps --disable-pip --progress-spinner off

  # Versionamiento automático (release.config.cjs, docs/RELEASES.md): solo
  # con el CI en verde. Un tag final en main se instala en todas las Pi.
  release:
    name: Versionamiento
    needs: [raspberry, esp32, sast, sca]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # main y develop tienen ruleset con PR obligatorio: el token de Actions
      # no puede empujar el commit de release ni el merge a develop. Hace
      # falta un PAT de una cuenta en el bypass, en el secret GH_TOKEN.
      - name: Verificar GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::Falta el secret GH_TOKEN (docs/RELEASES.md §1)"; exit 1; }
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Versiones mayores fijas: sin fijar, npm trae combinaciones que no
      # funcionan juntas (el preset 10 no corre con el writer de semantic-release 25).
      - name: Instalar semantic-release
        run: |
          npm install --no-save \
            semantic-release@25 \
            @semantic-release/commit-analyzer@13 \
            @semantic-release/release-notes-generator@14 \
            @semantic-release/changelog@7 \
            @semantic-release/exec@7 \
            @semantic-release/git@11 \
            @semantic-release/github@12 \
            conventional-changelog-conventionalcommits@9
      - name: Publicar versión
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx semantic-release
      # Sin esto develop no ve el tag de main y sigue sacando rc de la
      # versión ya publicada (lo que pasó en el broker).
      - name: Llevar el release de main a develop
        if: github.ref_name == 'main'
        run: |
          git fetch origin main develop --tags
          if ! git tag --points-at origin/main | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Sin release nuevo en main, no hay nada que llevar a develop"
            exit 0
          fi
          git config user.name "semantic-release-bot"
          git config user.email "semantic-release-bot@users.noreply.github.com"
          git checkout -B develop origin/develop
          git merge --no-ff origin/main -m "chore: llevar el release de main a develop [skip ci]" || {
            echo "::error::Conflicto al fusionar main en develop: hacerlo por PR (docs/RELEASES.md §3)"
            exit 1
          }
          git push origin develop

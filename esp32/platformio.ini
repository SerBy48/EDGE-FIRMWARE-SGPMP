; Firmware del nodo sensor ESP8266/ESP32 + SX1276 (Fase 1 de docs/PLAN_DESARROLLO.md).
; Parámetros de radio: deben coincidir con EDGE_LORA_* de la Raspberry.
;
;   pio run -e nodemcuv2                compilar (nodo actual: ESP8266 NodeMCU)
;   pio run -e nodemcuv2 -t upload      flashear (NODE_ID distinto por nodo)
;   pio run -e esp32dev                 compilar la variante ESP32
;   pio test -e native                  tests del protocolo en el PC

[platformio]
default_envs = nodemcuv2

; Común a las placas con radio. Cada env agrega sus propios flags.
[radio]
lib_deps =
    sandeepmistry/LoRa@^0.8.0
build_flags =
    -Wall
    ; --- Identidad: NODE_ID único por nodo del sitio (EDGE_LORA_NODES) ---
    -DNODE_ID=1
    -DNET_ID=0x01
    ; --- Radio [confirmar] con la regulación de la ANE antes de campo ---
    -DLORA_FREQ_HZ=915000000
    -DLORA_TX_POWER_DBM=14

; Nodo actual: NodeMCU/Wemos (ESP-12E) + SX1276 y el catálogo de sensores
; (DHT22, DS18B20, MPU6050, MAX30102): en cada captura se detecta cuáles
; están conectados y solo se envían esos. Cableado en esp32/README.md. D0
; (GPIO16) debe ir puenteado a RST para que el deep sleep despierte.
[env:nodemcuv2]
platform = espressif8266@^4.2.1
board = nodemcuv2
framework = arduino
; 74880 = la velocidad del ROM de arranque (SERIAL_BAUD en config.h).
monitor_speed = 74880
lib_deps =
    ${radio.lib_deps}
    paulstoffregen/OneWire@^2.3.8
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
build_flags =
    ${radio.build_flags}
    -DSENSOR_DHT22
    -DSENSOR_DS18B20
    -DSENSOR_MPU6050
    -DSENSOR_MAX30102
test_ignore = *

; Variante ESP32 DevKit + RFM95 por VSPI, con sensores simulados.
[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${radio.lib_deps}
build_flags =
    ${radio.build_flags}
    -DSENSOR_SIMULADO
test_ignore = *

; Tests del codec en el PC: requiere gcc/g++ en el PATH.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall

; Firmware del nodo sensor ESP32 + SX1276 (Fase 1 de docs/PLAN_DESARROLLO.md).
; Parámetros de radio: deben coincidir con EDGE_LORA_* de la Raspberry.
;
;   pio run -e esp32dev                 compilar
;   pio run -e esp32dev -t upload       flashear (NODE_ID distinto por nodo)
;   pio test -e native                  tests del protocolo en el PC

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    sandeepmistry/LoRa@^0.8.0
build_flags =
    -Wall
    ; --- Identidad: NODE_ID único por nodo del sitio (EDGE_LORA_NODES) ---
    -DNODE_ID=1
    -DNET_ID=0x01
    ; --- Radio [confirmar] con la regulación de la ANE antes de campo ---
    -DLORA_FREQ_HZ=915000000
    -DLORA_TX_POWER_DBM=14
    ; --- Sensores: SENSOR_SIMULADO hasta definir el hardware de sensado ---
    -DSENSOR_SIMULADO
test_ignore = *

; Tests del codec en el PC: requiere gcc/g++ en el PATH.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall

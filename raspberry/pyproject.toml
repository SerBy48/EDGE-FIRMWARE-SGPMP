[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sgpmp-edge-agent"
version = "0.3.0"
description = "SGPMP - edge_agent de la Raspberry: gateway LoRa <-> MQTT con enlace persistente al broker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "paho-mqtt>=2.1,<3",
    # Protocolo LoRa v2: AES-CCM y HKDF (docs/PROTOCOLO_LORA.md §11).
    "cryptography>=42",
]

[project.optional-dependencies]
# Radio SX1276 en la Raspberry (EDGE_SOURCE=lora). RPi.GPIO: backend de
# gpiozero para el pin de reset en Pi 3/4.
lora = [
    "spidev>=3.6; sys_platform == 'linux'",
    "gpiozero>=2.0; sys_platform == 'linux'",
    "RPi.GPIO>=0.7.1; sys_platform == 'linux'",
]
# Nodo con cámara (edge_vision, V1): detector YOLOv8n en ONNX, sin ultralytics.
vision = [
    "onnxruntime>=1.20",
    "numpy>=2",
    "opencv-python-headless>=4.10",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
edge-agent = "edge_agent.main:main"
edge-vision = "edge_vision.main:main"

[tool.hatch.build.targets.wheel]
packages = ["edge_agent", "edge_vision"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Los de integración van contra un ambiente real: pytest -m integration
addopts = "-m 'not integration'"
markers = ["integration: requiere broker/API reales (variables EDGE_IT_*)"]

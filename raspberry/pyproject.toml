[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sgpmp-edge-agent"
version = "0.1.0"
description = "SGPMP - edge_agent de la Raspberry: gateway LoRa <-> MQTT con enlace persistente al broker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "paho-mqtt>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
edge-agent = "edge_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["edge_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Los de integración van contra un ambiente real: pytest -m integration
addopts = "-m 'not integration'"
markers = ["integration: requiere broker/API reales (variables EDGE_IT_*)"]
